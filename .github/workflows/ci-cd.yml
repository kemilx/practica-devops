name: CI/CD - Docker Hub y Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

env:
  IMAGE_NAME: kemildev/hola-mundo-devops

jobs:
  test:
    name: Probar aplicación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

  publish-and-deploy:
    name: Publicar imagen y desplegar
    runs-on: ubuntu-latest
    needs: test
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generar etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar la imagen en Render
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          DEPLOY_HOOK: ${{ env.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: docker.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          curl --fail --silent --show-error --request POST \
            --url "${DEPLOY_HOOK}&imgURL=$(printf '%s' "$IMAGE_URL" | jq -sRr @uri)"

      - name: Informar configuración pendiente de Render
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "La imagen fue publicada; configura RENDER_DEPLOY_HOOK_URL para activar el despliegue."
